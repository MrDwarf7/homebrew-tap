name: Update casks

"on":
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: update-casks

permissions: {}

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check for releases and update casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          tap="${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/homebrew-}"
          brew tap "$tap"
          brew trust --tap "$tap"
          cd "$(brew --repository "$tap")"
          bash scripts/update-casks.sh "$tap"

      - name: Push changed casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tap="${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/homebrew-}"
          cd "$(brew --repository "$tap")"
          git diff --quiet -- Casks && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks
          git commit -m 'chore: bump cask versions'
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
